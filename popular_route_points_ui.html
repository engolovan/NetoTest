<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
  <title>Популярные точки маршрута</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: #0c111d;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
      margin: 0;
    }

    .app-container {
      max-width: 1600px;
      width: 100%;
      height: 95vh;
      display: flex;
      gap: 16px;
    }

    .map-section {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .map-wrapper {
      flex: 1;
      background: #131a2a;
      border-radius: 24px;
      border: 1px solid #253040;
      overflow: hidden;
      position: relative;
      box-shadow: 0 20px 40px -10px rgba(0,0,0,0.5);
    }

    #map { width: 100%; height: 100%; z-index: 1; }

    .map-top-panel {
      width: clamp(330px, 33.333%, 430px);
      min-height: 34px;
      border-radius: 9px;
      background: rgba(42, 47, 54, 0.94);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.22);
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: center;
      overflow: hidden;
      color: #ffffff;
      backdrop-filter: blur(10px);
    }

    .map-top-search {
      min-width: 0;
      padding: 0 12px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .map-top-nav {
      height: 100%;
      display: flex;
      align-items: stretch;
    }

    .map-top-nav-item {
      min-width: 42px;
      padding: 0 9px;
      border-left: 1px solid rgba(255, 255, 255, 0.12);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
    }

    .search-badges {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 10;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      max-width: calc(100% - 32px);
    }

    .search-badge {
      background: #1e2a3fe8;
      backdrop-filter: blur(8px);
      border-radius: 12px;
      padding: 8px 14px;
      border: 1px solid #2e3f58;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 12px;
      color: #cbd9f0;
      font-weight: 500;
      white-space: nowrap;
    }

    .search-badge.active {
      border-color: #3b82f6;
      background: #1e2f4a;
    }

    .badge-status {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      flex-shrink: 0;
    }

    .badge-status.done {
      background: #1a3a2a;
      color: #22c55e;
    }

    .badge-count {
      min-width: 24px;
      padding: 2px 7px;
      border-radius: 999px;
      background: #263a57;
      font-weight: 600;
      color: #ecf2ff;
      font-size: 13px;
      text-align: center;
    }

    .legend-card {
      position: absolute;
      left: 16px;
      bottom: 16px;
      z-index: 10;
      width: min(360px, calc(100% - 32px));
      background: #1e2a3fe8;
      border: 1px solid #2e3f58;
      border-radius: 16px;
      padding: 12px 14px;
      color: #cbd9f0;
      backdrop-filter: blur(8px);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.32);
      font-size: 12px;
    }

    .legend-card-title {
      color: #ecf2ff;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .legend-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 6px;
    }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .legend-dot.hot { background: #ef4444; box-shadow: 0 0 0 4px #ef444422; }
    .legend-dot.normal { background: #3b82f6; box-shadow: 0 0 0 4px #3b82f622; }

    .side-panel {
      width: 430px;
      background: #131a2a;
      border-radius: 24px;
      border: 1px solid #253040;
      box-shadow: 0 20px 40px -10px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      flex-shrink: 0;
    }

    .search-name-header {
      padding: 16px 20px 0;
      flex-shrink: 0;
    }

    .search-name-row {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      align-items: flex-start;
    }

    .search-name {
      font-weight: 600;
      font-size: 18px;
      color: #eef4ff;
      display: flex;
      align-items: center;
      gap: 10px;
      line-height: 1.3;
    }

    .search-name i { color: #3b82f6; font-size: 16px; }

    .search-name-sub {
      font-size: 12px;
      color: #7c95b5;
      margin-top: 4px;
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .header-actions {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
      width: 132px;
    }

    .filter-toggle,
    .report-toggle {
      width: 100%;
      background: #1e2f4a;
      border: 1px solid #3b82f6;
      color: #ecf2ff;
      border-radius: 12px;
      padding: 9px 11px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 12px;
      font-family: 'Inter', sans-serif;
      font-weight: 500;
      transition: 0.2s;
      flex-shrink: 0;
      justify-content: center;
    }

    .filter-toggle.is-static,
    .report-toggle.is-static {
      background: #172238;
      border-color: #2e3f58;
      color: #90a9d0;
      cursor: default;
    }

    .panel-tabs {
      display: flex;
      gap: 4px;
      padding: 16px 14px 12px;
      flex-shrink: 0;
    }

    .display-menu-wrap {
      position: relative;
      flex: 0 0 52px;
      display: flex;
    }

    .panel-tab {
      flex: 1;
      padding: 9px 8px;
      border-radius: 12px;
      font-weight: 500;
      font-size: 12px;
      background: transparent;
      border: 1px solid transparent;
      color: #90a9d0;
      cursor: default;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: 0.2s;
      white-space: nowrap;
      font-family: 'Inter', sans-serif;
    }

    .panel-tab i { font-size: 14px; }

    .panel-tab.active {
      background: #1e2f4a;
      border-color: #3b82f6;
      color: white;
    }

    .panel-tab.disabled {
      background: #172238;
      border-color: #253040;
      color: #607899;
    }

    .panel-tab.more-tab {
      width: 100%;
      flex: 0 0 auto;
      cursor: pointer;
    }

    .display-menu {
      position: absolute;
      top: calc(100% + 8px);
      right: 0;
      z-index: 30;
      display: none;
      width: 248px;
      padding: 8px;
      background: #0f1728;
      border: 1px solid #253040;
      border-radius: 14px;
      box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45);
    }

    .display-menu.active { display: block; }

    .display-menu-item {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 10px 12px;
      background: transparent;
      color: #90a9d0;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
      font-family: 'Inter', sans-serif;
      text-align: left;
      cursor: default;
    }

    .display-menu-item.active {
      background: #1e2f4a;
      color: #ecf2ff;
    }

    .display-menu-item i {
      width: 14px;
      text-align: center;
    }

    .panel-content {
      flex: 1;
      overflow-y: auto;
      padding: 8px 16px 16px;
    }

    .popular-header {
      background: #0f1728;
      border: 1px solid #253040;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
    }

    .popular-title {
      color: #eef4ff;
      font-size: 14px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .popular-title i { color: #5f9eff; }

    .point-chips {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin: 12px 0;
    }

    .point-chip {
      width: 100%;
      border: 1px solid #2e3f58;
      border-radius: 14px;
      padding: 10px 12px;
      background: #172238;
      color: #cbd9f0;
      cursor: pointer;
      display: block;
      font-family: 'Inter', sans-serif;
      text-align: left;
      transition: 0.2s;
    }

    .point-chip:hover,
    .point-chip.active {
      background: #1e2f4a;
      border-color: #3b82f6;
      color: #ecf2ff;
    }

    .point-chip-main {
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 10px;
    }

    .point-rank {
      width: 30px;
      height: 30px;
      border-radius: 10px;
      background: #1e2f4a;
      color: #5f9eff;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 600;
    }

    .point-chip.active .point-rank {
      background: #2563eb;
      color: #ffffff;
    }

    .point-name {
      font-size: 12px;
      font-weight: 600;
      color: #ecf2ff;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .point-area {
      font-size: 11px;
      color: #7c95b5;
      margin-top: 2px;
    }

    .point-count {
      min-width: 52px;
      padding: 4px 8px;
      border-radius: 999px;
      background: #24334c;
      color: #ecf2ff;
      font-size: 12px;
      font-weight: 600;
      text-align: center;
    }

    .point-intersections {
      display: none;
      margin-top: 12px;
    }

    .point-chip.active .point-intersections { display: block; }

    .event-card {
      background: #1a2338;
      border-radius: 14px;
      padding: 12px 14px;
      margin-bottom: 8px;
      border: 1px solid #2e3f58;
      cursor: default;
      transition: 0.15s;
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .event-card:last-child { margin-bottom: 0; }

    .event-icon {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: #1e2b40;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      color: #5f9eff;
      flex-shrink: 0;
    }

    .event-info { flex: 1; min-width: 0; }

    .event-type {
      font-weight: 600;
      font-size: 13px;
      color: #ecf2ff;
      margin-bottom: 2px;
    }

    .event-location {
      font-size: 12px;
      color: #7c95b5;
      margin-bottom: 4px;
    }

    .event-meta {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 5px;
    }

    .event-pill {
      color: #cbd9f0;
      font-size: 11px;
      padding: 3px 7px;
      border-radius: 999px;
      background: #24334c;
    }

    .event-time {
      font-size: 12px;
      color: #5f9eff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .panel-content::-webkit-scrollbar { width: 4px; }
    .panel-content::-webkit-scrollbar-thumb { background: #2e405b; border-radius: 4px; }

    .leaflet-popup-content-wrapper,
    .leaflet-popup-tip {
      background: #131a2a;
      color: #ecf2ff;
      border: 1px solid #253040;
    }

    .leaflet-popup-content {
      margin: 10px 12px;
      font-family: 'Inter', sans-serif;
      font-size: 12px;
      line-height: 1.45;
    }

    .point-marker {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 700;
      border: 2px solid rgba(255, 255, 255, 0.82);
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.38);
    }

    .point-marker.hot { background: #ef4444; }
    .point-marker.normal { background: #3b82f6; }
    .point-marker.selected {
      box-shadow: 0 0 0 6px #3b82f644, 0 10px 26px rgba(0, 0, 0, 0.45);
    }

    @media (max-width: 900px) {
      .app-container { flex-direction: column; height: auto; }
      .map-section { width: 100%; min-height: 450px; }
      .side-panel { width: 100%; max-height: none; }
      .map-wrapper { min-height: 400px; }
      .map-top-panel { width: 100%; max-width: 430px; min-height: 34px; grid-template-columns: minmax(76px, 1fr) auto; }
      .map-top-search { padding: 0 12px; font-size: 13px; }
      .map-top-nav-item { min-width: auto; padding: 0 9px; font-size: 13px; }
      .search-name-row { flex-direction: column; }
      .header-actions { width: 100%; display: grid; grid-template-columns: 1fr 1fr; }
      .display-menu { right: 0; }
    }
  </style>
</head>

<div class="app-container">
  <div class="map-section">

  <div class="side-panel">

        </div>
      </div>
    </div>

    <div class="panel-tabs" aria-label="Режимы отображения">
      <button class="panel-tab disabled" type="button" aria-disabled="true">
        <i class="fas fa-list-ul"></i> События
      </button>
      <button class="panel-tab disabled" type="button" aria-disabled="true">
        <i class="fas fa-route"></i> Маршруты
      </button>
      <div class="display-menu-wrap">
        <button class="panel-tab more-tab active" id="displayMenuToggle" type="button" onclick="toggleDisplayMenu(event)" aria-label="Варианты отображения" aria-expanded="false">
          <i class="fas fa-ellipsis-h"></i>
        </button>
        <div class="display-menu" id="displayMenu">
          <button class="display-menu-item" type="button" aria-disabled="true">
            <i class="fas fa-list-ul"></i>
            События
          </button>
          <button class="display-menu-item" type="button" aria-disabled="true">
            <i class="fas fa-route"></i>
            Маршруты
          </button>
          <button class="display-menu-item active" type="button" onclick="activatePopularMode()">
            <i class="fas fa-map-location-dot"></i>
            Популярные точки маршрута
          </button>
        </div>
      </div>
    </div>

    <div class="panel-content">
      <div class="popular-header">
        <div class="popular-title">
          <i class="fas fa-map-location-dot"></i>
          Популярные точки маршрута
        </div>
      </div>

      <div class="point-chips" id="pointChips"></div>
    </div>
  </div>
</div>

        { time: '2025-09-23 18:35:39', route: 'ул. Осипенко -> пр. Ленина', from: 'ул. Осипенко, 11', to: 'ул. Ново-Садовая, 160', duration: '5 мин 28 с', direction: '←' },
        { time: '2025-10-20 18:47:23', route: 'Ново-Садовая -> ул. Осипенко', from: 'ул. Ново-Садовая, 160', to: 'ул. Осипенко, 11', duration: '1 мин 57 с', direction: '→' },
        { time: '2025-11-14 09:54:40', route: 'ул. Демократическая -> Ново-Садовая', from: 'ул. Демократическая, 45', to: 'ул. Ново-Садовая, 160', duration: '7 мин 47 с', direction: '←' }
      ]
    },
    {
      id: 'p203',
      name: 'ул. Стара-Загора, 130',
      area: 'Кировский район',
      coords: [53.203055, 50.138888],
      passCount: 32,
      hot: false,
      intersections: [
        { time: '2025-09-22 10:28:16', route: 'ул. Стара-Загора -> ул. Ташкентская', from: 'ул. Стара-Загора, 118', to: 'ул. Ташкентская, 92', duration: '1 мин 41 с', direction: '→' },
        { time: '2025-10-27 10:23:02', route: 'ул. Ташкентская -> пр. Кирова', from: 'ул. Ташкентская, 92', to: 'пр. Кирова, 391', duration: '20 мин 56 с', direction: '→' },
        { time: '2025-11-12 12:56:59', route: 'пр. Кирова -> ул. Ташкентская', from: 'пр. Кирова, 391', to: 'ул. Ташкентская, 92', duration: '5 мин 00 с', direction: '←' }
      ]
    }
  ];

  const connectorLines = [
    [[53.119722, 49.939722], [53.1375, 49.975], '#b982ef'],
    [[53.1375, 49.975], [53.143899, 50.049745], '#2500ca'],
    [[53.143899, 50.049745], [53.1525, 50.068333], '#2500ca'],
    [[53.1525, 50.068333], [53.1725, 50.086111], '#b982ef'],
    [[53.1725, 50.086111], [53.1875, 50.08], '#c38bf1'],
    [[53.1875, 50.08], [53.203055, 50.138888], '#8c5be4'],
    [[53.203055, 50.138888], [53.2075, 50.135555], '#5b30d7']
  ];

  let selectedPointId = 'p143';
  const markerLayer = L.layerGroup().addTo(map);
  const routeLayer = L.layerGroup().addTo(map);

  function makeMarkerHtml(point, selected) {
    const markerClass = point.hot ? 'hot' : 'normal';
    const selectedClass = selected ? ' selected' : '';
    return `<div class="point-marker ${markerClass}${selectedClass}">${point.passCount}</div>`;
  }

  function renderMap() {
    markerLayer.clearLayers();
    routeLayer.clearLayers();

    connectorLines.forEach(([from, to, color]) => {
      L.polyline([from, to], {
        color,
        weight: 5,
        opacity: 0.78,
        lineCap: 'round'
      }).addTo(routeLayer);
    });

    points.forEach(point => {
      const selected = point.id === selectedPointId;
      const marker = L.marker(point.coords, {
        icon: L.divIcon({
          className: '',
          html: makeMarkerHtml(point, selected),
          iconSize: [42, 42],
          iconAnchor: [21, 21]
        })
      }).addTo(markerLayer);

      marker.bindPopup(`
        <strong>${point.name}</strong><br>
        ${point.area}<br>
        Число проездов в точке: ${point.passCount}
      `);
      marker.on('click', () => selectPoint(point.id));
    });

    const activePoint = points.find(point => point.id === selectedPointId);
    if (activePoint) {
      map.setView(activePoint.coords, 12, { animate: true });
    }
  }

  function renderPointChips() {
    const container = document.getElementById('pointChips');
    container.innerHTML = [...points]
      .sort((a, b) => b.passCount - a.passCount)
      .map((point, index) => `
        <div class="point-chip ${point.id === selectedPointId ? 'active' : ''}" role="button" tabindex="0" onclick="selectPoint('${point.id}')" onkeydown="handlePointKeydown(event, '${point.id}')">
          <div class="point-chip-main">
            <span class="point-rank">${index + 1}</span>
            <span>
              <span class="point-name">${point.name}</span>
              <span class="point-area">${point.area}</span>
            </span>
            <span class="point-count">${point.passCount}</span>
          </div>
          <div class="point-intersections">
            ${point.intersections.map(intersection => `
              <div class="event-card">
                <div class="event-icon"><i class="fas fa-car"></i></div>
                <div class="event-info">
                  <div class="event-type">Проезд через популярную точку</div>
                  <div class="event-location">${point.name}</div>
                  <div class="event-meta">
                    <span class="event-pill">${intersection.route}</span>
                    <span class="event-pill">${intersection.direction}</span>
                    <span class="event-pill">${intersection.duration}</span>
                  </div>
                  <div class="event-location">${intersection.from} → ${intersection.to}</div>
                  <div class="event-time"><i class="far fa-clock"></i> ${intersection.time}</div>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `).join('');
  }

  function selectPoint(pointId) {
    selectedPointId = pointId;
    renderPointChips();
    renderMap();
  }

  function handlePointKeydown(event, pointId) {
    if (event.key === 'Enter' || event.key === ' ') {
      event.preventDefault();
      selectPoint(pointId);
    }
  }

  function toggleDisplayMenu(event) {
    event.stopPropagation();
    const menu = document.getElementById('displayMenu');
    const button = document.getElementById('displayMenuToggle');
    menu.classList.toggle('active');
    button.setAttribute('aria-expanded', menu.classList.contains('active') ? 'true' : 'false');
  }

  function activatePopularMode() {
    document.getElementById('displayMenu').classList.remove('active');
    document.getElementById('displayMenuToggle').setAttribute('aria-expanded', 'false');
    document.querySelector('.popular-header').scrollIntoView({ behavior: 'smooth', block: 'start' });
  }

  document.addEventListener('click', event => {
    if (!event.target.closest('.display-menu-wrap')) {
      document.getElementById('displayMenu').classList.remove('active');
      document.getElementById('displayMenuToggle').setAttribute('aria-expanded', 'false');
    }
  });

  renderPointChips();
  renderMap();
  window.map = map;
</script>
</body>
</html>
