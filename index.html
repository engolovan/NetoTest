<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Изменение глубины архива</title>
  <style>
    :root {
      --bg: #15191d;
      --modal: #242a30;
      --modal-top: #262d33;
      --panel: #2a3036;
      --text: #b7bfca;
      --muted: #b3bbc7;
      --border: rgba(255, 255, 255, 0.03);
      --red: #a34a4c;
      --blue: #456bd4;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 22% 30%, rgba(76, 88, 96, 0.26), transparent 29%),
        radial-gradient(circle at 78% 22%, rgba(47, 58, 65, 0.35), transparent 30%),
        linear-gradient(180deg, #101418 0%, #151a1e 100%);
    }

    .screen {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: rgba(7, 10, 13, 0.68);
      backdrop-filter: blur(2px);
    }

    .modal {
      position: absolute;
      top: 13px;
      left: 8px;
      width: calc(100vw - 14px);
      max-width: 1012px;
      min-height: 335px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.025);
      border-radius: 14px;
      background: linear-gradient(180deg, var(--modal-top) 0%, #22282e 100%);
      box-shadow:
        0 24px 60px rgba(0, 0, 0, 0.62),
        inset 0 1px 0 rgba(255, 255, 255, 0.03);
    }

    .header {
      position: relative;
      height: 96px;
      padding: 46px 36px 0;
      background: rgba(30, 36, 41, 0.53);
    }

    .title {
      margin: 0;
      font-size: 27px;
      line-height: 1;
      font-weight: 700;
      letter-spacing: 0.2px;
      color: #aeb8c6;
      text-shadow: 0 1px 1px rgba(0, 0, 0, 0.65);
    }

    .close {
      position: absolute;
      top: 15px;
      right: 22px;
      width: 26px;
      height: 26px;
      border: 0;
      padding: 0;
      cursor: default;
      background: transparent;
      opacity: 0.98;
    }

    .close::before,
    .close::after {
      content: "";
      position: absolute;
      top: 12px;
      left: 2px;
      width: 28px;
      height: 4px;
      border-radius: 3px;
      background: #b8c1cd;
      box-shadow: 0 0 2px rgba(0, 0, 0, 0.55);
    }

    .close::before {
      transform: rotate(45deg);
    }

    .close::after {
      transform: rotate(-45deg);
    }

    .content {
      position: relative;
      height: 135px;
      padding: 38px 47px 0 53px;
      background: rgba(35, 41, 47, 0.66);
    }

    .form-row {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .label {
      width: 315px;
      font-size: 27px;
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.25px;
      color: #aeb8c7;
      text-shadow: 0 1px 1px rgba(0, 0, 0, 0.7);
    }

    .input {
      width: 170px;
      height: 70px;
      border: 3px solid rgba(163, 74, 76, 0.82);
      border-radius: 17px;
      outline: none;
      background: linear-gradient(180deg, #30383d 0%, #2a3136 100%);
      color: #d7dde5;
      font-size: 30px;
      font-weight: 700;
      text-align: center;
      box-shadow:
        0 0 0 1px rgba(255, 95, 95, 0.1),
        0 0 12px rgba(169, 62, 64, 0.38),
        inset 0 2px 8px rgba(0, 0, 0, 0.22);
    }

    .select {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 198px;
      height: 70px;
      padding: 0 20px 0 25px;
      border: 1px solid rgba(255, 255, 255, 0.035);
      border-radius: 15px;
      background: linear-gradient(180deg, #343c43 0%, #30383e 45%, #2d3439 100%);
      box-shadow:
        0 6px 14px rgba(0, 0, 0, 0.16),
        inset 0 1px 0 rgba(255, 255, 255, 0.025);
    }

    .select span {
      font-size: 25px;
      font-weight: 700;
      color: #f0f2f5;
      text-shadow:
        0 0 2px rgba(255, 255, 255, 0.35),
        0 2px 2px rgba(0, 0, 0, 0.72);
    }

    .chevron {
      width: 19px;
      height: 19px;
      margin-top: -7px;
      border-right: 4px solid #dce2e8;
      border-bottom: 4px solid #dce2e8;
      border-radius: 2px;
      transform: rotate(45deg);
      filter: drop-shadow(0 1px 1px rgba(0, 0, 0, 0.55));
    }

    .button {
      width: 182px;
      height: 68px;
      margin-left: 0;
      border: 1px solid rgba(47, 71, 159, 0.35);
      border-radius: 15px;
      background: linear-gradient(180deg, #466edb 0%, var(--blue) 100%);
      color: rgba(229, 232, 240, 0.58);
      font-size: 24px;
      font-weight: 700;
      text-shadow: 0 1px 1px rgba(0, 0, 0, 0.55);
      box-shadow:
        0 8px 18px rgba(21, 33, 95, 0.24),
        inset 0 1px 0 rgba(255, 255, 255, 0.08);
    }

    .note {
      height: 83px;
      margin: 0 27px 0 40px;
      padding: 28px 0 0 4px;
      border-top: 1px solid rgba(74, 88, 102, 0.38);
      background: rgba(43, 49, 55, 0.88);
      color: var(--muted);
      font-size: 21px;
      font-style: italic;
      font-weight: 700;
      line-height: 1.2;
      letter-spacing: -0.4px;
      text-shadow: 0 1px 1px rgba(0, 0, 0, 0.75);
    }

    .cursor-hand {
      position: absolute;
      right: 250px;
      bottom: 5px;
      width: 22px;
      height: 31px;
      opacity: 0.96;
      filter: drop-shadow(0 2px 2px rgba(0, 0, 0, 0.65));
    }

    .cursor-hand::before {
      content: "";
      position: absolute;
      left: 8px;
      top: 0;
      width: 8px;
      height: 28px;
      border-radius: 6px;
      background: #ffffff;
    }

    .cursor-hand::after {
      content: "";
      position: absolute;
      left: 2px;
      top: 10px;
      width: 18px;
      height: 18px;
      border-radius: 8px 8px 5px 5px;
      background: #ffffff;
      clip-path: polygon(38% 0, 56% 0, 56% 45%, 70% 25%, 81% 37%, 70% 55%, 86% 46%, 96% 62%, 72% 81%, 31% 81%, 12% 45%, 27% 37%, 38% 55%);
    }

    @media (max-width: 820px) {
      .modal {
        position: relative;
        top: 13px;
        left: 8px;
        width: calc(100vw - 16px);
      }

      .content {
        height: auto;
        padding-right: 30px;
        padding-bottom: 24px;
      }

      .form-row {
        flex-wrap: wrap;
      }

      .label {
        width: 100%;
      }

      .cursor-hand {
        display: none;
      }
    }
  </style>
</head>
<body>
  <main class="screen">
    <section class="modal" aria-labelledby="modal-title">
      <header class="header">
        <h1 id="modal-title" class="title">Изменение глубины архива</h1>
        <button class="close" type="button" aria-label="Закрыть"></button>
      </header>

      <div class="content">
        <div class="form-row">
          <label class="label" for="archive-depth">Глубина архива</label>
          <input id="archive-depth" class="input" type="text" />

          <div class="select" role="button" aria-label="Единицы измерения">
            <span>Минут</span>
            <i class="chevron" aria-hidden="true"></i>
          </div>

          <button class="button" type="button">Применить</button>
        </div>
      </div>

      <p class="note">Последнее изменение: от 24.01.01 , 1 месяц, от Иванов И.И.</p>
      <div class="cursor-hand" aria-hidden="true"></div>
    </section>
  </main>
</body>
</html>
